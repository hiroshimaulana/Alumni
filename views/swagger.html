<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swagger / OpenAPI Documentation — Istanbul University MIS Alumni Portal</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
    <style>
        :root {
            --primary-navy: #003366;
            --primary-gold: #C5A059;
            --secondary-dark: #0F172A;
            --slate-bg: #F8FAFC;
        }

        body {
            margin: 0;
            padding: 0;
            background: #FAFAFA;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        header {
            background-color: var(--primary-navy);
            color: #FFFFFF;
            padding: 1.25rem 2rem;
            box-shadow: 0 4px 12px rgba(0, 51, 102, 0.15);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-badge {
            background-color: var(--primary-gold);
            color: var(--primary-navy);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        nav a {
            color: #FFFFFF;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0.9;
        }

        nav a:hover, nav a.active {
            opacity: 1;
            border-bottom: 2px solid var(--primary-gold);
            padding-bottom: 0.2rem;
        }

        .swagger-ui .topbar {
            display: none;
        }

        .swagger-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem 4rem 1.5rem;
        }

        .download-links {
            max-width: 1200px;
            margin: 1rem auto 0 auto;
            padding: 0 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            font-size: 0.9rem;
        }

        .download-links a {
            color: var(--primary-navy);
            font-weight: 600;
            text-decoration: none;
            background: #E2E8F0;
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
        }

        .download-links a:hover {
            background: #CBD5E1;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="brand-title">
                <span>İstanbul Üniversitesi</span>
                <span class="brand-badge">MIS</span>
            </div>
            <nav>
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/users">Users</a>
                <a href="/swagger" class="active">Swagger API Docs</a>
                <a href="/openapi.json" target="_blank">OpenAPI JSON</a>
            </nav>
        </div>
    </header>

    <div class="download-links">
        <span>Raw OpenAPI Specification:</span>
        <a href="/openapi.json" target="_blank">&darr; openapi.json</a>
        <a href="/openapi.yaml" target="_blank">&darr; openapi.yaml</a>
    </div>

    <div class="swagger-container">
        <div id="swagger-ui"></div>
    </div>

    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            window.ui = SwaggerUIBundle({
                url: "/openapi.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                defaultModelsExpandDepth: 2,
                defaultModelExpandDepth: 2,
                docExpansion: "list"
            });
        };
    </script>
</body>
</html>
