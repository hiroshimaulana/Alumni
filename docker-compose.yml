services:
  # ----------------------------------------------------------------------------
  # MySQL Database Service (Storage & Relational Schema)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: iu_alumni_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-iu_mis_alumni}
      MYSQL_USER: ${DB_USERNAME:-alumni_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rootsecret}
    ports:
      - "${DOCKER_DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootsecret}"]
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - alumni_net

  # ----------------------------------------------------------------------------
  # PHP 8.3 Apache Web Application Service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: iu_alumni_web
    restart: unless-stopped
    ports:
      - "${DOCKER_WEB_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-iu_mis_alumni}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rootsecret}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alumni_net

  # ----------------------------------------------------------------------------
  # phpMyAdmin Web GUI for Database Exploration
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: iu_alumni_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootsecret}
    ports:
      - "${DOCKER_PMA_PORT:-8080}:80"
    depends_on:
      - db
    networks:
      - alumni_net

volumes:
  db_data:
    driver: local

networks:
  alumni_net:
    driver: bridge
